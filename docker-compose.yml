services:
  polardrinks-app:
    build:
      context: ./PolarDrinks
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      polardrinks-db:
        condition: service_healthy
    environment:
      - ConnectionStrings__DefaultConnection=Server=polardrinks-db;Database=PolaDrinks;User Id=sa;Password=SuaSenhaForte123!;TrustServerCertificate=True;
    volumes:
      - polardrinks-uploads:/app/wwwroot/uploads
    restart: unless-stopped

  polardrinks-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=SuaSenhaForte123!
    ports:
      - "1433:1433"
    volumes:
      - polardrinks-db-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

volumes:
  polardrinks-db-data:
  polardrinks-uploads: